[build-system]
requires = [
    "pybind11>=2.12",
    "scikit-build-core>=0.10",
]
build-backend = "scikit_build_core.build"

[project]
name = "calcchinesecalendar"
version = "0.0.0"
description = "Native Python bindings for the CalcChineseCalendar lunar ephemeris, astronomy, and calendar engine."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "lzray-universe" },
]
urls = { Homepage = "https://github.com/lzray-universe/CalcChineseCalendar/", Repository = "https://github.com/lzray-universe/CalcChineseCalendar/" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.scikit-build]
cmake.source-dir = "../.."
wheel.packages = ["src/calcchinesecalendar"]
cmake.args = [
    "-DLUNAR_BUILD_PYTHON_MODULE=ON",
    "-DLUNAR_BUILD_EXECUTABLE=OFF",
    "-DLUNAR_BUILD_SHARED_LIB=OFF",
    "-DLUNAR_BUILD_TESTS=OFF",
]
