name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name"
        required: true
        type: string
      prerelease:
        description: "Is prerelease"
        required: true
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64-st
            kind: musl
            system: linux
            arch: x64
            mode: st
            threads: OFF
            zig_target: x86_64-linux-musl

          - os: ubuntu-latest
            name: linux-arm64-st
            kind: musl
            system: linux
            arch: arm64
            mode: st
            threads: OFF
            zig_target: aarch64-linux-musl

          - os: windows-latest
            name: windows-x64-st
            kind: native
            system: windows
            arch: x64
            mode: st
            threads: OFF
            cmake_args: ""

          - os: windows-latest
            name: windows-arm64-st
            kind: native
            system: windows
            arch: arm64
            mode: st
            threads: OFF
            cmake_args: "-A ARM64"

          - os: macos-latest
            name: macos-universal-st
            kind: native
            system: macos
            arch: universal
            mode: st
            threads: OFF
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"'

          - os: ubuntu-latest
            name: linux-x64-mt
            kind: musl
            system: linux
            arch: x64
            mode: mt
            threads: ON
            zig_target: x86_64-linux-musl

          - os: ubuntu-latest
            name: linux-arm64-mt
            kind: musl
            system: linux
            arch: arm64
            mode: mt
            threads: ON
            zig_target: aarch64-linux-musl

          - os: windows-latest
            name: windows-x64-mt
            kind: native
            system: windows
            arch: x64
            mode: mt
            threads: ON
            cmake_args: ""

          - os: windows-latest
            name: windows-arm64-mt
            kind: native
            system: windows
            arch: arm64
            mode: mt
            threads: ON
            cmake_args: "-A ARM64"

          - os: macos-latest
            name: macos-universal-mt
            kind: native
            system: macos
            arch: universal
            mode: mt
            threads: ON
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"'

          - os: ubuntu-latest
            name: wasm
            kind: emscripten
            system: wasm
            arch: wasm
            emsdk_version: 5.0.3

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Derive release tag
        id: rel
        shell: bash
        run: |
          set -euxo pipefail
          tag='${{ inputs.tag }}'
          safe_tag="${tag//\//-}"
          safe_tag="${safe_tag// /-}"
          echo "tag=${safe_tag}" >> "$GITHUB_OUTPUT"

      - name: Derive build version
        id: ver
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.kind }}" = "emscripten" ]; then
            echo "text=lunar-wasm-${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "text=lunar-${{ matrix.system }}-${{ matrix.arch }}-${{ inputs.tag }}(${{ matrix.mode }})" >> "$GITHUB_OUTPUT"
          fi

    
      - name: Configure (native)
        if: matrix.kind == 'native'
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DLUNAR_VERSION='${{ steps.ver.outputs.text }}'
          -DLUNAR_ENABLE_SERIES_FALLBACK=ON
          -DLUNAR_ENABLE_THREADS=${{ matrix.threads }}
          -DLUNAR_ENABLE_IPO=ON
          -DLUNAR_ENABLE_FAST_MATH=OFF
          ${{ matrix.cmake_args }}

      - name: Build (native)
        if: matrix.kind == 'native'
        run: cmake --build build --config Release -j

      - name: Setup Emscripten
        if: matrix.kind == 'emscripten'
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install ${{ matrix.emsdk_version }}
          "$RUNNER_TEMP/emsdk/emsdk" activate ${{ matrix.emsdk_version }}

      - name: Configure (emscripten)
        if: matrix.kind == 'emscripten'
        shell: bash
        run: |
          set -euxo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUNAR_VERSION='${{ steps.ver.outputs.text }}' \
            -DLUNAR_ENABLE_SERIES_FALLBACK=ON \
            -DLUNAR_ENABLE_IPO=OFF \
            -DLUNAR_ENABLE_FAST_MATH=OFF \
            -DLUNAR_BUILD_TESTS=OFF

      - name: Build (emscripten)
        if: matrix.kind == 'emscripten'
        shell: bash
        run: |
          set -euxo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --build build -j

      
      - name: Setup Zig (musl)
        if: matrix.kind == 'musl'
        uses: goto-bus-stop/setup-zig@v2

      - name: Configure (musl static)
        if: matrix.kind == 'musl'
        shell: bash
        run: |
          set -euxo pipefail

          cat > zigcc <<'EOF'
          #!/usr/bin/env bash
          exec zig cc -target ${{ matrix.zig_target }} "$@"
          EOF

          cat > zigcxx <<'EOF'
          #!/usr/bin/env bash
          exec zig c++ -target ${{ matrix.zig_target }} "$@"
          EOF

          chmod +x zigcc zigcxx

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUNAR_VERSION='${{ steps.ver.outputs.text }}' \
            -DLUNAR_ENABLE_SERIES_FALLBACK=ON \
            -DLUNAR_ENABLE_THREADS=${{ matrix.threads }} \
            -DLUNAR_ENABLE_IPO=ON \
            -DLUNAR_ENABLE_FAST_MATH=OFF \
            -DCMAKE_C_COMPILER="$PWD/zigcc" \
            -DCMAKE_CXX_COMPILER="$PWD/zigcxx" \
            -DCMAKE_C_FLAGS="-Wno-error=date-time -Wno-date-time" \
            -DCMAKE_CXX_FLAGS="-Wno-error=date-time -Wno-date-time" \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: Build (musl static)
        if: matrix.kind == 'musl'
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build -j

      - name: Verify static (musl)
        if: matrix.kind == 'musl'
        shell: bash
        run: |
          set -euxo pipefail
          file build/lunar || true
          ldd build/lunar || true

      
      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euxo pipefail
          mkdir -p package
          cp README.md package/
          cp README_zh.md package/
          cp LICENSE package/
          archive_base="lunar-${{ matrix.name }}-${RELEASE_TAG}"

          if [ "${{ matrix.kind }}" = "emscripten" ]; then
            cp build/lunar.js package/
            cp build/lunar.wasm package/
            cp build/lunar_worker.js package/
            cd package
            tar -czvf "../${archive_base}.tar.gz" *
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp -R vsop87a package/
            cp -R elpmpp02 package/
            cp build/Release/lunar.exe package/
            cp build/Release/lunar.dll package/ || true
            cp build/Release/lunar.lib package/ || true
            cd package
            7z a "../${archive_base}.zip" *
          else
            cp -R vsop87a package/
            cp -R elpmpp02 package/
            cp build/lunar package/
            cp build/liblunar.so package/ 2>/dev/null || true
            cp build/liblunar.dylib package/ 2>/dev/null || true
            cd package
            tar -czvf "../${archive_base}.tar.gz" *
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lunar-${{ matrix.name }}
          path: lunar-${{ matrix.name }}-${{ steps.rel.outputs.tag }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euxo pipefail

          current_tag='${{ inputs.tag }}'
          if git rev-parse -q --verify "refs/tags/$current_tag" >/dev/null; then
            current_ref="refs/tags/$current_tag"
          else
            current_ref="HEAD"
          fi

          previous_tag="$(
            git for-each-ref refs/tags \
              --sort=-creatordate \
              --format='%(refname:short)' |
            grep -Fxv "$current_tag" |
            head -n 1 || true
          )"

          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${current_ref}"
          else
            range="${current_ref}"
          fi

          PREVIOUS_TAG="$previous_tag" RANGE="$range" CURRENT_TAG="$current_tag" python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          previous_tag = os.environ.get("PREVIOUS_TAG", "").strip()
          current_tag = os.environ.get("CURRENT_TAG", "").strip()
          range_spec = os.environ["RANGE"]
          out_path = Path("release_notes.md")

          log_text = subprocess.check_output(
              [
                  "git",
                  "log",
                  "--reverse",
                  "--format=%H%x1f%s%x1f%b%x1e",
                  range_spec,
              ],
              text=True,
              encoding="utf-8",
          )

          sections: list[str] = []
          for item in log_text.split("\x1e"):
              item = item.strip()
              if not item:
                  continue
              commit, subject, body = item.split("\x1f", 2)
              subject = subject.strip()
              body = body.strip()
              short_commit = commit[:7]
              section = [f"## {subject}", f"- Commit: `{short_commit}`"]
              if body:
                  section.append("")
                  section.append(body)
              sections.append("\n".join(section))

          title = "# Release Notes"
          if previous_tag:
              title += f"\n\nChanges from `{previous_tag}` to `{current_tag or 'current build'}`."
          else:
              title += f"\n\nChanges included in `{current_tag or 'this release'}`."

          if sections:
              out_path.write_text(
                  title + "\n\n" + "\n\n".join(sections) + "\n",
                  encoding="utf-8",
              )
          else:
              out_path.write_text(
                  title + "\n\nNo commits found for this release range.\n",
                  encoding="utf-8",
              )
          PY

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          body_path: release_notes.md
          files: artifacts/*
