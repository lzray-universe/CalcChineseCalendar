name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name"
        required: true
        type: string
      prerelease:
        description: "Is prerelease"
        required: true
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          
          - os: ubuntu-latest
            name: linux-x64-musl
            kind: musl
            zig_target: x86_64-linux-musl

          - os: ubuntu-latest
            name: linux-arm64-musl
            kind: musl
            zig_target: aarch64-linux-musl

          
          - os: windows-latest
            name: windows-x64
            kind: native
            cmake_args: ""

          - os: windows-latest
            name: windows-arm64
            kind: native
            cmake_args: "-A ARM64"

          
          - os: macos-latest
            name: macos-universal
            kind: native
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"'

          - os: ubuntu-latest
            name: wasm-emscripten
            kind: emscripten
            emsdk_version: 5.0.3

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

    
      - name: Configure (native)
        if: matrix.kind == 'native'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLUNAR_ENABLE_SERIES_FALLBACK=ON ${{ matrix.cmake_args }}

      - name: Build (native)
        if: matrix.kind == 'native'
        run: cmake --build build --config Release -j

      - name: Setup Emscripten
        if: matrix.kind == 'emscripten'
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install ${{ matrix.emsdk_version }}
          "$RUNNER_TEMP/emsdk/emsdk" activate ${{ matrix.emsdk_version }}

      - name: Configure (emscripten)
        if: matrix.kind == 'emscripten'
        shell: bash
        run: |
          set -euxo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUNAR_ENABLE_SERIES_FALLBACK=ON \
            -DLUNAR_BUILD_TESTS=OFF

      - name: Build (emscripten)
        if: matrix.kind == 'emscripten'
        shell: bash
        run: |
          set -euxo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --build build -j

      
      - name: Setup Zig (musl)
        if: matrix.kind == 'musl'
        uses: goto-bus-stop/setup-zig@v2

      - name: Configure (musl static)
        if: matrix.kind == 'musl'
        shell: bash
        run: |
          set -euxo pipefail

          cat > zigcc <<'EOF'
          #!/usr/bin/env bash
          exec zig cc -target ${{ matrix.zig_target }} "$@"
          EOF

          cat > zigcxx <<'EOF'
          #!/usr/bin/env bash
          exec zig c++ -target ${{ matrix.zig_target }} "$@"
          EOF

          chmod +x zigcc zigcxx

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUNAR_ENABLE_SERIES_FALLBACK=ON \
            -DCMAKE_C_COMPILER="$PWD/zigcc" \
            -DCMAKE_CXX_COMPILER="$PWD/zigcxx" \
            -DCMAKE_C_FLAGS="-Wno-error=date-time -Wno-date-time" \
            -DCMAKE_CXX_FLAGS="-Wno-error=date-time -Wno-date-time" \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: Build (musl static)
        if: matrix.kind == 'musl'
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build -j

      - name: Verify static (musl)
        if: matrix.kind == 'musl'
        shell: bash
        run: |
          set -euxo pipefail
          file build/lunar || true
          ldd build/lunar || true

      
      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package
          cp README.md package/
          cp LICENSE package/

          if [ "${{ matrix.kind }}" = "emscripten" ]; then
            cp build/lunar.js package/
            cp build/lunar.wasm package/
            cp build/lunar_worker.js package/
            cd package
            tar -czvf ../lunar-${{ matrix.name }}.tar.gz *
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp -R vsop87a package/
            cp -R elpmpp02 package/
            cp build/Release/lunar.exe package/
            cp build/Release/lunar.dll package/ || true
            cp build/Release/lunar.lib package/ || true
            cd package
            7z a ../lunar-${{ matrix.name }}.zip *
          else
            cp -R vsop87a package/
            cp -R elpmpp02 package/
            cp build/lunar package/
            cp build/liblunar.so package/ 2>/dev/null || true
            cp build/liblunar.dylib package/ 2>/dev/null || true
            cd package
            tar -czvf ../lunar-${{ matrix.name }}.tar.gz *
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lunar-${{ matrix.name }}
          path: lunar-${{ matrix.name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: artifacts/*
