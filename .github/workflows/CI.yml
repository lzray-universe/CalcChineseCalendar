name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            build_type: Release
            cmake_args: ""

          - os: ubuntu-24.04-arm
            name: linux-arm64
            build_type: Release
            cmake_args: ""

          - os: windows-latest
            name: windows-x64
            build_type: Release
            cmake_args: "-A x64"

          - os: windows-11-arm
            name: windows-arm64
            build_type: Release
            cmake_args: "-A ARM64"

          - os: macos-15-intel
            name: macos-x64
            build_type: Release
            cmake_args: ""

          - os: macos-latest
            name: macos-arm64
            build_type: Release
            cmake_args: ""

          - os: ubuntu-latest
            name: linux-x64-relwithdebinfo
            build_type: RelWithDebInfo
            cmake_args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLUNAR_ENABLE_SERIES_FALLBACK=ON
          -DLUNAR_BUILD_TESTS=ON
          -DLUNAR_ENABLE_IPO=ON
          -DLUNAR_ENABLE_FAST_MATH=OFF
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: >
          ctest --test-dir build -C ${{ matrix.build_type }}
          --output-on-failure
          -E SeriesVsBsp

      - name: Download BSP Reference
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'ci-de440s.bsp'
          if (!(Test-Path $out)) {
            Invoke-WebRequest `
              'https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp' `
              -OutFile $out
          }
          if ((Get-Item $out).Length -le 0) {
            throw "downloaded BSP file is empty: $out"
          }
          Write-Host "BSP reference: $out"

      - name: Test Series vs BSP
        env:
          LUNAR_TEST_BSP: ${{ github.workspace }}/ci-de440s.bsp
        run: >
          ctest --test-dir build -C ${{ matrix.build_type }}
          --output-on-failure
          -R SeriesVsBsp
